name: Linux native toolchain
description: Compilers for better-sqlite3 / node-pty on Ubuntu or Amazon Linux CodeBuild images.

runs:
  using: composite
  steps:
    - name: Install gcc/make/python3 when missing
      shell: bash
      run: |
        set -euo pipefail
        if command -v python3 >/dev/null 2>&1 && command -v make >/dev/null 2>&1 && \
           (command -v g++ >/dev/null 2>&1 || command -v clang++ >/dev/null 2>&1); then
          echo "Native toolchain already present"
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y python3 make g++ unzip
        elif command -v dnf >/dev/null 2>&1; then
          sudo dnf install -y python3 make gcc-c++ unzip tar gzip
        else
          echo "No apt-get or dnf; install python3, make, and a C++ compiler on this image"
          exit 1
        fi
