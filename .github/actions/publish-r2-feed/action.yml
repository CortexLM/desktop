name: Publish R2 feed
description: >
  Flatten electron-builder feed files and rclone copy them to an R2
  destination. Callers pass the full rclone remote (bucket, optional prefix).
  Copy, not sync: versioned installers stay.

inputs:
  artifacts-dir:
    description: Directory that contains downloaded GitHub artifacts
    required: false
    default: artifacts
  destination:
    description: rclone remote, e.g. r2:cortex-software/staging
    required: true
  bucket-check:
    description: Fail if this substring appears in destination (production bucket from a staging job)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Flatten feed files
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
      run: |
        set -euo pipefail
        mkdir -p feed
        find "${ARTIFACTS_DIR}" -type f \( \
          -name '*.yml' -o -name 'RELEASES' -o -name '*.blockmap' -o \
          -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
          -name '*.AppImage' -o -name '*.deb' \
        \) -exec cp -n {} feed/ \;
        ls -la feed
        if [ -z "$(ls -A feed)" ]; then
          echo "No feed files to publish"
          exit 1
        fi
        if ! ls feed/latest*.yml >/dev/null 2>&1; then
          echo "Missing electron-builder latest*.yml in the feed"
          exit 1
        fi

    - name: Install rclone
      uses: ./.github/actions/install-rclone

    # Callers must set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and
    # CLOUDFLARE_ACCOUNT_ID on this step. Do not echo them.
    - name: rclone copy to R2
      shell: bash
      env:
        DESTINATION: ${{ inputs.destination }}
        BUCKET_CHECK: ${{ inputs.bucket-check }}
      run: |
        set -euo pipefail
        : "${R2_ACCESS_KEY_ID:?missing env R2_ACCESS_KEY_ID}"
        : "${R2_SECRET_ACCESS_KEY:?missing env R2_SECRET_ACCESS_KEY}"
        : "${CLOUDFLARE_ACCOUNT_ID:?missing env CLOUDFLARE_ACCOUNT_ID}"
        : "${DESTINATION:?missing destination}"
        if [ -n "${BUCKET_CHECK}" ] && printf '%s' "${DESTINATION}" | grep -F -q "${BUCKET_CHECK}"; then
          echo "Destination '${DESTINATION}' must not contain '${BUCKET_CHECK}'"
          exit 1
        fi
        ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

        export RCLONE_CONFIG_R2_TYPE=s3
        export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
        export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export RCLONE_CONFIG_R2_ENDPOINT="$ENDPOINT"
        export RCLONE_CONFIG_R2_ACL=private
        export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true

        rclone copy feed "${DESTINATION}" \
          --exclude "*.yml" \
          --exclude "RELEASES" \
          --header-upload "Cache-Control: public, max-age=31536000, immutable" \
          --checksum \
          --transfers 4 \
          --stats-one-line \
          --stats 30s

        rclone copy feed "${DESTINATION}" \
          --include "*.yml" \
          --include "RELEASES" \
          --exclude "*" \
          --header-upload "Cache-Control: public, max-age=60, must-revalidate" \
          --checksum \
          --stats-one-line
