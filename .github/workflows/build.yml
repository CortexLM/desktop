name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64,arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64,arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run dist:mac

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun run dist:win

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        run: bun run dist:linux

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          retention-days: 5

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 5

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-linux.yml
            dist/latest-linux-arm64.yml
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/RELEASES
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Production update feed. The packaged app checks
  # https://releases.cortex.foundation/ (electron-builder.yml publish.url,
  # generic provider — not GitHub Releases).
  #
  # Tag → flatten yml/blockmap/installers → rclone copy to R2 bucket
  # `cortex-releases` (objects at the bucket root) → custom domain
  # releases.cortex.foundation → electron-updater GET /latest.yml.
  # Staging must not write this origin. No AWS keys. R2 only.
  publish-feed:
    name: Publish production update feed
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/') && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    concurrency:
      group: publish-feed-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten feed files
        run: |
          set -euo pipefail
          mkdir -p feed
          find artifacts -type f \( \
            -name '*.yml' -o -name 'RELEASES' -o -name '*.blockmap' -o \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' \
          \) -exec cp -n {} feed/ \;
          ls -la feed
          if [ -z "$(ls -A feed)" ]; then
            echo "No feed files to publish"
            exit 1
          fi
          if ! ls feed/latest*.yml >/dev/null 2>&1; then
            echo "Missing electron-builder latest*.yml in the feed"
            exit 1
          fi

      - name: Install rclone
        env:
          RCLONE_VERSION: '1.70.3'
        run: |
          set -euo pipefail
          curl -fsSL -o rclone.zip \
            "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          unzip -q rclone.zip
          sudo install -m 755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      # Copy, not sync: previous versioned installers stay in the bucket.
      # Secrets live on GitHub Environment `production` so staging cannot read them.
      - name: Upload feed to production R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_RELEASES_BUCKET: ${{ vars.PRODUCTION_RELEASES_BUCKET }}
        run: |
          set -euo pipefail
          : "${R2_ACCESS_KEY_ID:?missing secret R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?missing secret R2_SECRET_ACCESS_KEY}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing secret CLOUDFLARE_ACCOUNT_ID}"
          BUCKET="${PRODUCTION_RELEASES_BUCKET:-cortex-releases}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="$ENDPOINT"
          export RCLONE_CONFIG_R2_ACL=private
          export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true

          rclone copy feed "r2:${BUCKET}" \
            --exclude "*.yml" \
            --exclude "RELEASES" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --checksum \
            --transfers 4 \
            --stats-one-line \
            --stats 30s

          rclone copy feed "r2:${BUCKET}" \
            --include "*.yml" \
            --include "RELEASES" \
            --exclude "*" \
            --header-upload "Cache-Control: public, max-age=60, must-revalidate" \
            --checksum \
            --stats-one-line
