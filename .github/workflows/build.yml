# Production tag build. Linux electron-builder uses CodeBuild
# (codebuild-cortex-gha-arm64-… or x64). macOS/Windows stay on GitHub-hosted
# runners for signing. See docs/runbooks/desktop-staging-prod.md.

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
            arch: x64,arm64
          - runner: windows-latest
            platform: win
            arch: x64
          # Long Linux dist: CodeBuild, not ubuntu-latest.
          - runner: codebuild-cortex-gha-${{ vars.CODEBUILD_RUNNER_ARCH == 'x64' && 'x64' || 'arm64' }}-${{ github.run_id }}-${{ github.run_attempt }}
            platform: linux
            arch: x64,arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Linux native toolchain
        if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-native-toolchain

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run dist:mac

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun run dist:win

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        run: bun run dist:linux

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          retention-days: 5

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 5

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-linux.yml
            dist/latest-linux-arm64.yml
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/RELEASES
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Production update feed. The packaged app checks
  # https://releases.cortex.foundation/ (electron-builder.yml publish.url,
  # generic provider — not GitHub Releases).
  #
  # Tag → flatten yml/blockmap/installers → rclone copy to R2 bucket
  # `cortex-releases` (objects at the bucket root) → custom domain
  # releases.cortex.foundation → electron-updater GET /latest.yml.
  # Optional mirror to software.cortex.foundation/latest/ when
  # PRODUCTION_SOFTWARE_BUCKET is set. Staging must not write this origin.
  publish-feed:
    name: Publish production update feed
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/') && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    concurrency:
      group: publish-feed-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload feed to production R2 (bucket root)
        uses: ./.github/actions/publish-r2-feed
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          artifacts-dir: artifacts
          destination: r2:${{ vars.PRODUCTION_RELEASES_BUCKET || 'cortex-releases' }}

      - name: Mirror feed to software.cortex.foundation/latest/
        if: ${{ vars.PRODUCTION_SOFTWARE_BUCKET != '' }}
        uses: ./.github/actions/publish-r2-feed
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          artifacts-dir: artifacts
          destination: r2:${{ vars.PRODUCTION_SOFTWARE_BUCKET }}/latest
