name: Continuous Monitoring

on:
  schedule:
    - cron: '*/15 * * * *' # Toutes les 15 minutes
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build check
        id: build
        run: |
          echo "Starting build..."
          bun run build
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: TypeScript check
        id: typecheck
        run: |
          echo "Running TypeScript checks..."
          bun run typecheck
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Lint check
        id: lint
        run: |
          echo "Running linter..."
          bun run lint || echo "status=warning" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Code quality metrics
        id: metrics
        run: |
          echo "## Code Quality Metrics" > metrics.txt
          echo "" >> metrics.txt
          
          # Lines of code
          echo "### Lines of Code" >> metrics.txt
          LOC=$(find packages -name "*.ts" -o -name "*.tsx" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          echo "Total LOC: $LOC" >> metrics.txt
          echo "" >> metrics.txt
          
          # File count
          echo "### File Statistics" >> metrics.txt
          TS_FILES=$(find packages -name "*.ts" | wc -l)
          TSX_FILES=$(find packages -name "*.tsx" | wc -l)
          echo "TypeScript files: $TS_FILES" >> metrics.txt
          echo "TSX files: $TSX_FILES" >> metrics.txt
          echo "" >> metrics.txt
          
          # Package sizes
          echo "### Package Sizes" >> metrics.txt
          for dir in packages/*/; do
            if [ -d "$dir/dist" ]; then
              SIZE=$(du -sh "$dir/dist" | cut -f1)
              NAME=$(basename "$dir")
              echo "- $NAME: $SIZE" >> metrics.txt
            fi
          done
          
          cat metrics.txt
          echo "loc=$LOC" >> $GITHUB_OUTPUT

      - name: Generate monitoring report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          TYPECHECK_STATUS="${{ steps.typecheck.outputs.status }}"
          LINT_STATUS="${{ steps.lint.outputs.status }}"
          LOC="${{ steps.metrics.outputs.loc }}"
          
          # Create or append to monitoring log
          if [ ! -f MONITORING_LOG.md ]; then
            echo "# Cortex IDE - Monitoring Log" > MONITORING_LOG.md
            echo "" >> MONITORING_LOG.md
            echo "Automated monitoring reports generated every 15 minutes." >> MONITORING_LOG.md
            echo "" >> MONITORING_LOG.md
            echo "| Timestamp | Build | TypeCheck | Lint | LOC | Status |" >> MONITORING_LOG.md
            echo "|-----------|-------|-----------|------|-----|--------|" >> MONITORING_LOG.md
          fi
          
          # Determine overall status
          if [ "$BUILD_STATUS" = "success" ] && [ "$TYPECHECK_STATUS" = "success" ]; then
            OVERALL="✅ Healthy"
          else
            OVERALL="⚠️ Issues"
          fi
          
          # Format statuses with emojis
          BUILD_EMOJI=$([ "$BUILD_STATUS" = "success" ] && echo "✅" || echo "❌")
          TYPECHECK_EMOJI=$([ "$TYPECHECK_STATUS" = "success" ] && echo "✅" || echo "❌")
          LINT_EMOJI=$([ "$LINT_STATUS" = "success" ] && echo "✅" || echo "⚠️")
          
          echo "| $TIMESTAMP | $BUILD_EMOJI | $TYPECHECK_EMOJI | $LINT_EMOJI | $LOC | $OVERALL |" >> MONITORING_LOG.md

      - name: Commit monitoring log
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add MONITORING_LOG.md
          git diff --staged --quiet || git commit -m "chore: update monitoring log [skip ci]"
          git push || true
        continue-on-error: true

      - name: Create issue on failure
        if: steps.build.outputs.status != 'success' || steps.typecheck.outputs.status != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Monitoring Alert: Build or TypeCheck Failed';
            const body = `
            ## Monitoring Alert
            
            **Timestamp:** ${new Date().toISOString()}
            **Workflow:** ${context.workflow}
            **Run:** ${context.runNumber}
            
            ### Status
            - Build: ${{ steps.build.outputs.status }}
            - TypeCheck: ${{ steps.typecheck.outputs.status }}
            - Lint: ${{ steps.lint.outputs.status }}
            
            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            // Check if similar issue exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitoring-alert'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['monitoring-alert', 'automated']
              });
            }
