name: Nightly Test Suite

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      # Runs before the suites: a nightly that passes while files silently went
      # unloaded is the failure mode this guard exists to catch, and it is cheap
      # relative to the 60-minute job around it.
      - name: Verify every test file is claimed and loadable
        run: bun run test:discovery

      # `continue-on-error` + a deferred assert at the end of the job, not a
      # silenced failure: a hard failure at this step would skip every suite
      # below it — turning the one job meant to report comprehensively into a
      # job that reports almost nothing. The outcome is asserted in "Fail if any
      # suite failed" below, so the job still goes red.
      #
      # This step carries the repo-wide gate in vitest.config.ts, which is the
      # only place the *aggregate* denominator is scored — test-suite.yml gates
      # per package, so a cross-package regression is visible here first. As of
      # 2026-08-17 that gate passes (71.4% statements over 278 files); it was
      # previously documented here as permanently unmet, which was true only
      # because `coverage.include` was unset and 56 product files never entered
      # the denominator.
      - name: Run all unit tests with coverage
        id: coverage
        continue-on-error: true
        run: bun run test:coverage
      
      - name: Run integration tests
        run: bun run test:integration
      
      - name: Install Playwright
        run: bunx playwright install chromium --with-deps
      
      - name: Build application
        run: bun run build
      
      - name: Run all E2E tests
        run: bun run test:e2e
      
      # `vitest bench --run` exits 1 ("No benchmark files found") — the repo has
      # no `*.bench.ts`. The perf suites are ordinary vitest tests driven by
      # tests/performance/bench-harness.ts.
      - name: Run performance benchmarks
        run: bun run test:performance
      
      - name: Run visual regression tests
        run: bun run test:visual-regression
      
      # Asserts the outcome of every step that was allowed to continue, so the
      # job's own result still reflects reality.
      - name: Fail if any suite failed
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.coverage.outcome }}" != "success" ]; then
            echo "::error::Unit tests / coverage gate did not pass (outcome: ${{ steps.coverage.outcome }})."
            exit 1
          fi

      - name: Upload comprehensive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: |
            test-results/
            coverage/
            tests/performance/results/
            tests/visual-regression/diff/
          retention-days: 30
      
      - name: Generate detailed report
        if: always()
        run: |
          echo "# Nightly Test Report" > report.md
          echo "Date: $(date)" >> report.md
          echo "" >> report.md
          echo "## Coverage Summary" >> report.md
          # Add coverage stats
          echo "" >> report.md
          echo "## Performance Metrics" >> report.md
          # Add perf metrics
      
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: report.md

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: comprehensive-tests
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "Nightly tests failed - notification would be sent here"
          # Add Slack/Discord/Email notification
