name: Performance Benchmarks

on:
  schedule:
    - cron: '0 3 * * *' # Tous les jours à 3h du matin UTC
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: |
          echo "Building application..."
          time bun run build

      - name: Measure build time
        id: build_time
        run: |
          START=$(date +%s)
          bun run build
          END=$(date +%s)
          DURATION=$((END - START))
          
          echo "Build completed in ${DURATION}s"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Measure bundle sizes
        id: bundle_size
        run: |
          echo "## Bundle Sizes" > bundle-report.txt
          echo "" >> bundle-report.txt
          
          # Main package
          if [ -d packages/main/dist ]; then
            MAIN_SIZE=$(du -sh packages/main/dist | cut -f1)
            MAIN_BYTES=$(du -sb packages/main/dist | cut -f1)
            echo "Main package: $MAIN_SIZE" >> bundle-report.txt
            echo "main_kb=$((MAIN_BYTES / 1024))" >> $GITHUB_OUTPUT
          fi
          
          # Renderer package — packages/app since the React renderer was deleted.
          #
          # The `renderer_kb` output name is kept because five later steps read it, and it
          # is still the renderer's bundle. The path is what mattered: guarded by
          # `-d packages/renderer/dist`, this block silently stopped running, leaving
          # `renderer_kb` empty — which the JS steps below interpolate directly, producing
          # `const bundleSize = ;` and a syntax error rather than a useful report.
          #
          # Source maps are excluded. `build.sourcemap` is on, so dist carries a ~2.4 MB
          # `.map` beside a ~750 KB bundle — three times the artefact being measured. The
          # regression threshold below is 2048 KB, so including the map put every run
          # permanently over it and the "regression detected" branch fired on every build,
          # main included. Maps are not shipped to a browser and are not what this metric
          # is for.
          if [ -d packages/app/dist ]; then
            RENDERER_SIZE=$(du -sh --exclude='*.map' packages/app/dist | cut -f1)
            RENDERER_BYTES=$(du -sb --exclude='*.map' packages/app/dist | cut -f1)
            echo "Renderer package: $RENDERER_SIZE (excluding source maps)" >> bundle-report.txt
            echo "renderer_kb=$((RENDERER_BYTES / 1024))" >> $GITHUB_OUTPUT
          else
            # Explicit zero rather than an absent output: an empty string breaks the
            # numeric comparisons and the JS interpolation downstream.
            echo "Renderer package: MISSING (packages/app/dist not built)" >> bundle-report.txt
            echo "renderer_kb=0" >> $GITHUB_OUTPUT
          fi
          
          # Preload package
          if [ -d packages/preload/dist ]; then
            PRELOAD_SIZE=$(du -sh packages/preload/dist | cut -f1)
            PRELOAD_BYTES=$(du -sb packages/preload/dist | cut -f1)
            echo "Preload package: $PRELOAD_SIZE" >> bundle-report.txt
            echo "preload_kb=$((PRELOAD_BYTES / 1024))" >> $GITHUB_OUTPUT
          fi
          
          # Total
          TOTAL_SIZE=$(du -sh packages/*/dist 2>/dev/null | awk '{s+=$1} END {print s}')
          echo "" >> bundle-report.txt
          echo "Total: $TOTAL_SIZE" >> bundle-report.txt
          
          cat bundle-report.txt

      - name: Analyze code complexity
        id: complexity
        run: |
          echo "Analyzing code complexity..."
          
          # Count total files
          TOTAL_FILES=$(find packages -name "*.ts" -o -name "*.tsx" | wc -l)
          
          # Count lines of code
          TOTAL_LOC=$(find packages -name "*.ts" -o -name "*.tsx" | xargs wc -l | tail -1 | awk '{print $1}')
          
          # Average file size
          AVG_LOC=$((TOTAL_LOC / TOTAL_FILES))
          
          # Count large files (>500 LOC)
          LARGE_FILES=$(find packages -name "*.ts" -o -name "*.tsx" | xargs wc -l | awk '$1 > 500 {print $0}' | wc -l)
          
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "total_loc=$TOTAL_LOC" >> $GITHUB_OUTPUT
          echo "avg_loc=$AVG_LOC" >> $GITHUB_OUTPUT
          echo "large_files=$LARGE_FILES" >> $GITHUB_OUTPUT
          
          echo "Total files: $TOTAL_FILES"
          echo "Total LOC: $TOTAL_LOC"
          echo "Average LOC per file: $AVG_LOC"
          echo "Large files (>500 LOC): $LARGE_FILES"

      - name: Memory and startup simulation
        id: startup
        run: |
          echo "Simulating startup metrics..."
          
          # Count dependencies
          DEPS=$(cat package.json | grep -o '".*":' | wc -l || echo "0")
          
          # Estimate startup time based on bundle size and deps
          # This is a rough estimate - real metrics would need Electron runtime
          RENDERER_KB="${{ steps.bundle_size.outputs.renderer_kb }}"
          ESTIMATED_STARTUP=$((RENDERER_KB / 100 + DEPS / 10))
          
          echo "deps=$DEPS" >> $GITHUB_OUTPUT
          echo "estimated_startup_ms=$ESTIMATED_STARTUP" >> $GITHUB_OUTPUT
          
          echo "Dependencies: $DEPS"
          echo "Estimated startup: ~${ESTIMATED_STARTUP}ms"

      - name: TypeScript compilation performance
        id: tsc_perf
        run: |
          echo "Measuring TypeScript compilation..."
          
          START=$(date +%s%3N)
          bun run typecheck
          END=$(date +%s%3N)
          DURATION=$((END - START))
          
          echo "TypeScript check completed in ${DURATION}ms"
          echo "duration_ms=$DURATION" >> $GITHUB_OUTPUT

      - name: Generate performance report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          BUILD_TIME="${{ steps.build_time.outputs.duration }}"
          MAIN_SIZE="${{ steps.bundle_size.outputs.main_kb }}"
          RENDERER_SIZE="${{ steps.bundle_size.outputs.renderer_kb }}"
          PRELOAD_SIZE="${{ steps.bundle_size.outputs.preload_kb }}"
          TOTAL_LOC="${{ steps.complexity.outputs.total_loc }}"
          AVG_LOC="${{ steps.complexity.outputs.avg_loc }}"
          LARGE_FILES="${{ steps.complexity.outputs.large_files }}"
          TSC_TIME="${{ steps.tsc_perf.outputs.duration_ms }}"
          DEPS="${{ steps.startup.outputs.deps }}"
          EST_STARTUP="${{ steps.startup.outputs.estimated_startup_ms }}"
          
          cat > performance-report.md << EOF
          # Performance Benchmark Report
          
          **Generated:** $TIMESTAMP
          **Workflow Run:** #${{ github.run_number }}
          
          ## Build Performance
          
          | Metric | Value | Status |
          |--------|-------|--------|
          | Build Time | ${BUILD_TIME}s | $([ "$BUILD_TIME" -lt 60 ] && echo "✅" || echo "⚠️") |
          | TypeScript Check | ${TSC_TIME}ms | $([ "$TSC_TIME" -lt 30000 ] && echo "✅" || echo "⚠️") |
          
          ## Bundle Sizes
          
          | Package | Size (KB) | Status |
          |---------|-----------|--------|
          | Main | ${MAIN_SIZE} | $([ "$MAIN_SIZE" -lt 1024 ] && echo "✅" || echo "⚠️") |
          | Renderer | ${RENDERER_SIZE} | $([ "$RENDERER_SIZE" -lt 5120 ] && echo "✅" || echo "⚠️") |
          | Preload | ${PRELOAD_SIZE} | $([ "$PRELOAD_SIZE" -lt 512 ] && echo "✅" || echo "⚠️") |
          
          ## Code Metrics
          
          | Metric | Value | Status |
          |--------|-------|--------|
          | Total LOC | ${TOTAL_LOC} | ℹ️ |
          | Avg LOC/File | ${AVG_LOC} | $([ "$AVG_LOC" -lt 300 ] && echo "✅" || echo "⚠️") |
          | Large Files (>500 LOC) | ${LARGE_FILES} | $([ "$LARGE_FILES" -lt 10 ] && echo "✅" || echo "⚠️") |
          | Dependencies | ${DEPS} | $([ "$DEPS" -lt 100 ] && echo "✅" || echo "⚠️") |
          
          ## Runtime Estimates
          
          | Metric | Value |
          |--------|-------|
          | Estimated Startup | ~${EST_STARTUP}ms |
          
          ## Trends
          
          Compare with previous runs to track performance over time.
          
          EOF
          
          cat performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.run_number }}
          path: performance-report.md
          retention-days: 90

      - name: Update performance log
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          BUILD_TIME="${{ steps.build_time.outputs.duration }}"
          RENDERER_SIZE="${{ steps.bundle_size.outputs.renderer_kb }}"
          TOTAL_LOC="${{ steps.complexity.outputs.total_loc }}"
          TSC_TIME="${{ steps.tsc_perf.outputs.duration_ms }}"
          
          # Create or append to performance log
          if [ ! -f PERFORMANCE_LOG.md ]; then
            echo "# Cortex IDE - Performance Benchmark Log" > PERFORMANCE_LOG.md
            echo "" >> PERFORMANCE_LOG.md
            echo "Automated performance benchmarks run daily." >> PERFORMANCE_LOG.md
            echo "" >> PERFORMANCE_LOG.md
            echo "| Timestamp | Build (s) | Bundle (KB) | LOC | TSC (ms) | Status | Report |" >> PERFORMANCE_LOG.md
            echo "|-----------|-----------|-------------|-----|----------|--------|--------|" >> PERFORMANCE_LOG.md
          fi
          
          # Determine status
          if [ "$BUILD_TIME" -lt 60 ] && [ "$RENDERER_SIZE" -lt 5120 ] && [ "$TSC_TIME" -lt 30000 ]; then
            STATUS="✅ Good"
          else
            STATUS="⚠️ Review"
          fi
          
          REPORT_LINK="[View](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          echo "| $TIMESTAMP | $BUILD_TIME | $RENDERER_SIZE | $TOTAL_LOC | $TSC_TIME | $STATUS | $REPORT_LINK |" >> PERFORMANCE_LOG.md

      - name: Commit performance log
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add PERFORMANCE_LOG.md
          git diff --staged --quiet || git commit -m "chore: update performance benchmark log [skip ci]"
          git push || true
        continue-on-error: true

      # MEASURED 2026-08-25: packages/app/dist is 1001 KB (250 KB of JS + CSS + HTML,
      # the rest a sourcemap). The old React renderer was ~5 MB, dominated by Monaco, so
      # the 10 MB ceiling this inherited can no longer trip — a gate that cannot fire is
      # not a gate. 2048 KB leaves room for Monaco to return to the session workbench
      # while still catching an accidental order-of-magnitude regression.
      - name: Performance regression detection
        if: steps.build_time.outputs.duration > 120 || steps.bundle_size.outputs.renderer_kb > 2048
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Performance Regression Detected';
            const buildTime = ${{ steps.build_time.outputs.duration }};
            const bundleSize = ${{ steps.bundle_size.outputs.renderer_kb || 0 }};
            
            const body = `
            ## Performance Regression Alert
            
            **Timestamp:** ${new Date().toISOString()}
            
            ### Metrics
            - Build Time: ${buildTime}s ${buildTime > 120 ? '🔴 (> 120s threshold)' : ''}
            - Renderer Bundle: ${bundleSize}KB ${bundleSize > 10240 ? '🔴 (> 10MB threshold)' : ''}
            
            ### Recommendations
            - Review recent changes for performance impact
            - Consider code splitting or lazy loading
            - Check for unnecessary dependencies
            - Profile build process
            
            [View full benchmark report](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance-regression'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['performance-regression', 'automated', 'performance']
              });
            }

      - name: Comment on PR if applicable
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildTime = ${{ steps.build_time.outputs.duration }};
            const rendererSize = ${{ steps.bundle_size.outputs.renderer_kb || 0 }};
            const totalLoc = ${{ steps.complexity.outputs.total_loc }};
            
            const body = `
            ## 📊 Performance Benchmark
            
            | Metric | Value |
            |--------|-------|
            | Build Time | ${buildTime}s |
            | Renderer Bundle | ${(rendererSize / 1024).toFixed(2)}MB |
            | Total LOC | ${totalLoc} |
            
            [View detailed report](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
