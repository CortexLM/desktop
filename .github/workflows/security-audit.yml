name: Security Audit

on:
  schedule:
    - cron: '0 2 * * *' # Tous les jours à 2h du matin UTC
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        id: audit
        run: |
          echo "Running dependency audit..."
          bun pm audit --json > audit-report.json || true
          
          # Parse results
          if [ -f audit-report.json ]; then
            VULNERABILITIES=$(cat audit-report.json | grep -c '"severity"' || echo "0")
            echo "Found $VULNERABILITIES vulnerabilities"
            echo "count=$VULNERABILITIES" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check for secrets in code
        id: secrets
        run: |
          echo "Scanning for potential secrets..."
          
          # Simple regex patterns for common secrets
          SECRETS_FOUND=0
          
          # API keys
          if grep -r "api[_-]key.*=.*['\"][a-zA-Z0-9]{20,}" packages/ 2>/dev/null; then
            echo "⚠️ Potential API keys found"
            SECRETS_FOUND=$((SECRETS_FOUND + 1))
          fi
          
          # Private keys
          if grep -r "BEGIN.*PRIVATE KEY" packages/ 2>/dev/null; then
            echo "⚠️ Private keys found"
            SECRETS_FOUND=$((SECRETS_FOUND + 1))
          fi
          
          # Tokens
          if grep -r "token.*=.*['\"][a-zA-Z0-9_-]{30,}" packages/ 2>/dev/null; then
            echo "⚠️ Potential tokens found"
            SECRETS_FOUND=$((SECRETS_FOUND + 1))
          fi
          
          echo "secrets=$SECRETS_FOUND" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check security best practices
        id: practices
        run: |
          echo "Checking security best practices..."
          ISSUES=0
          
          # Check for eval usage
          if grep -r "eval(" packages/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "⚠️ Found eval() usage - potential security risk"
            ISSUES=$((ISSUES + 1))
          fi
          
          # Check for dangerouslySetInnerHTML
          if grep -r "dangerouslySetInnerHTML" packages/ --include="*.tsx" 2>/dev/null; then
            echo "⚠️ Found dangerouslySetInnerHTML usage - review required"
            ISSUES=$((ISSUES + 1))
          fi
          
          # Check for console.log in production code
          CONSOLE_LOGS=$(grep -r "console\\.log" packages/ --include="*.ts" --include="*.tsx" 2>/dev/null | wc -l || echo "0")
          if [ "$CONSOLE_LOGS" -gt 50 ]; then
            echo "⚠️ Excessive console.log usage: $CONSOLE_LOGS instances"
            ISSUES=$((ISSUES + 1))
          fi
          
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT
          echo "console_logs=$CONSOLE_LOGS" >> $GITHUB_OUTPUT

      - name: Analyze dependencies for known vulnerabilities
        id: deps
        run: |
          echo "Analyzing dependencies..."
          
          # Check for outdated critical packages
          OUTDATED=$(bun outdated 2>/dev/null | grep -i "electron\|react\|typescript" | wc -l || echo "0")
          
          echo "outdated=$OUTDATED" >> $GITHUB_OUTPUT

      - name: Generate security report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          VULNERABILITIES="${{ steps.audit.outputs.count }}"
          SECRETS="${{ steps.secrets.outputs.secrets }}"
          ISSUES="${{ steps.practices.outputs.issues }}"
          CONSOLE_LOGS="${{ steps.practices.outputs.console_logs }}"
          OUTDATED="${{ steps.deps.outputs.outdated }}"
          
          # Create security report
          cat > security-report.md << EOF
          # Security Audit Report
          
          **Generated:** $TIMESTAMP
          **Workflow Run:** #${{ github.run_number }}
          
          ## Summary
          
          | Category | Count | Status |
          |----------|-------|--------|
          | Dependency Vulnerabilities | $VULNERABILITIES | $([ "$VULNERABILITIES" -eq 0 ] && echo "✅" || echo "⚠️") |
          | Potential Secrets | $SECRETS | $([ "$SECRETS" -eq 0 ] && echo "✅" || echo "🚨") |
          | Security Issues | $ISSUES | $([ "$ISSUES" -eq 0 ] && echo "✅" || echo "⚠️") |
          | Console Logs | $CONSOLE_LOGS | $([ "$CONSOLE_LOGS" -lt 50 ] && echo "✅" || echo "⚠️") |
          | Outdated Core Deps | $OUTDATED | $([ "$OUTDATED" -eq 0 ] && echo "✅" || echo "⚠️") |
          
          ## Details
          
          ### Dependency Audit
          $([ -f audit-report.json ] && cat audit-report.json || echo "No vulnerabilities found")
          
          ### Recommendations
          
          EOF
          
          # Add recommendations based on findings
          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "- 🔴 Update vulnerable dependencies immediately" >> security-report.md
          fi
          
          if [ "$SECRETS" -gt 0 ]; then
            echo "- 🔴 Remove hardcoded secrets and use environment variables" >> security-report.md
          fi
          
          if [ "$ISSUES" -gt 0 ]; then
            echo "- ⚠️ Review and fix security best practice violations" >> security-report.md
          fi
          
          if [ "$CONSOLE_LOGS" -gt 50 ]; then
            echo "- ⚠️ Reduce console.log usage in production code" >> security-report.md
          fi
          
          if [ "$OUTDATED" -gt 0 ]; then
            echo "- ⚠️ Update outdated core dependencies" >> security-report.md
          fi
          
          cat security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: security-report.md
          retention-days: 30

      - name: Update security log
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          VULNERABILITIES="${{ steps.audit.outputs.count }}"
          SECRETS="${{ steps.secrets.outputs.secrets }}"
          ISSUES="${{ steps.practices.outputs.issues }}"
          
          # Create or append to security log
          if [ ! -f SECURITY_LOG.md ]; then
            echo "# Cortex IDE - Security Audit Log" > SECURITY_LOG.md
            echo "" >> SECURITY_LOG.md
            echo "Automated security audits run daily." >> SECURITY_LOG.md
            echo "" >> SECURITY_LOG.md
            echo "| Timestamp | Vulnerabilities | Secrets | Issues | Status | Report |" >> SECURITY_LOG.md
            echo "|-----------|-----------------|---------|--------|--------|--------|" >> SECURITY_LOG.md
          fi
          
          # Determine overall status
          if [ "$VULNERABILITIES" -eq 0 ] && [ "$SECRETS" -eq 0 ] && [ "$ISSUES" -eq 0 ]; then
            STATUS="✅ Secure"
          elif [ "$SECRETS" -gt 0 ]; then
            STATUS="🚨 Critical"
          else
            STATUS="⚠️ Warning"
          fi
          
          REPORT_LINK="[View](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          echo "| $TIMESTAMP | $VULNERABILITIES | $SECRETS | $ISSUES | $STATUS | $REPORT_LINK |" >> SECURITY_LOG.md

      - name: Commit security log
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add SECURITY_LOG.md
          git diff --staged --quiet || git commit -m "chore: update security audit log [skip ci]"
          git push || true
        continue-on-error: true

      - name: Create security issue on critical findings
        if: steps.secrets.outputs.secrets > 0 || steps.audit.outputs.count > 10
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Critical Security Alert';
            const body = `
            ## Security Audit Alert
            
            **Timestamp:** ${new Date().toISOString()}
            **Severity:** Critical
            
            ### Findings
            - Dependency Vulnerabilities: ${{ steps.audit.outputs.count }}
            - Potential Secrets: ${{ steps.secrets.outputs.secrets }}
            - Security Issues: ${{ steps.practices.outputs.issues }}
            
            ### Action Required
            ${parseInt('${{ steps.secrets.outputs.secrets }}') > 0 ? '🔴 **IMMEDIATE ACTION REQUIRED:** Secrets detected in code!' : ''}
            ${parseInt('${{ steps.audit.outputs.count }}') > 10 ? '⚠️ Multiple dependency vulnerabilities found.' : ''}
            
            [View full security report](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-alert'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security-alert', 'critical', 'automated']
              });
            }
