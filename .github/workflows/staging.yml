# Staging artifacts. Push to `staging` builds web + Electron and is ready for
# OIDC deploy later (same shape as CortexLM/backend PR 37).
#
# - GitHub Environment: `staging` (production is a separate environment)
# - permissions.id-token: write — assume an AWS role when one is configured
# - No AWS access keys in this repo
# - Do not run electron-builder and then vitest in the same job (ABI shadow)
# - Deploy stays off until vars.STAGING_DEPLOY_ENABLED is set; the staging
#   AWS account is still CLOSED.

name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  artifacts:
    name: Build web and Electron artifacts
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages (web UI + main + preload)
        run: bun run build
        env:
          VITE_CORTEX_API_BASE_URL: ${{ vars.VITE_CORTEX_API_BASE_URL }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-web-staging
          path: packages/app/dist/
          retention-days: 14

      - name: Pack Electron (Linux unpacked)
        run: npx electron-builder --dir --linux
        env:
          # Signing/publish stay unset on purpose. Artifacts only.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-electron-linux-staging
          path: |
            dist/linux-unpacked/
            dist/*.yml
          retention-days: 14
          if-no-files-found: warn

  deploy:
    name: Deploy to staging (OIDC, gated)
    needs: artifacts
    if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_AWS_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_AWS_REGION }}

      - name: Deploy is not wired while the staging account is CLOSED
        run: |
          echo "OIDC assumed. Wire the deploy command when the staging AWS account opens."
          echo "Do not put AWS keys in git. Production uses a separate environment."
