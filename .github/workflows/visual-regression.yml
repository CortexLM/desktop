name: Visual Regression Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-tests:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      
      - name: Build application
        run: bun run build
      
      - name: Run visual regression tests
        run: bun run screenshots:capture
        continue-on-error: true
      
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 30
      
      - name: Download baseline screenshots
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: visual-regression.yml
          name: screenshots-baseline
          path: screenshots-baseline/
          if_no_artifact_found: warn
      
      - name: Compare with baseline
        if: success()
        run: |
          if [ -d "screenshots-baseline" ]; then
            ./scripts/compare-screenshots.sh || true
          else
            echo "No baseline found, skipping comparison"
          fi
      
      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report-${{ github.sha }}
          path: screenshots/comparison/
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const screenshotCount = fs.readdirSync('screenshots').filter(f => f.endsWith('.png')).length;
            
            const comment = `## 📸 Visual Regression Test Results
            
            **Screenshots captured:** ${screenshotCount}
            
            ### 📊 View Results
            - [View Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Download the \`screenshots-${{ github.sha }}\` artifact to view all screenshots
            - Download the \`comparison-report-${{ github.sha }}\` artifact to see differences
            
            ### 🔍 Manual Review Required
            Please review the screenshots to ensure:
            - ✅ UI matches design specifications
            - ✅ No visual regressions
            - ✅ All states are rendered correctly
            - ✅ Dark and light themes work properly
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## Visual Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Screenshots:** $(find screenshots -name '*.png' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **App Views:** $(find screenshots -maxdepth 1 -name '*.png' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Components:** $(find screenshots/components -name '*.png' 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Storybook:** $(find screenshots/storybook -name '*.png' 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
