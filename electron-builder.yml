appId: foundation.cortex.desktop
productName: Cortex
copyright: Copyright © 2026 Cortex Foundation / CortexLM
asar: true

directories:
  output: dist
  buildResources: build

# Main and preload are single esbuild bundles (engine, AI SDK and MCP client inlined); the renderer is a Vite build.
# No native addons: persistence uses node:sqlite.
files:
  - packages/desktop/dist/**/*
  - packages/app/dist/**/*
  - package.json
  - "!**/node_modules/**/*"

extraResources:
  - from: packages/i18n/locales
    to: locales
    filter: ["**/*.json", "!**/*.source.json", "!fixtures/**"]

extraMetadata:
  main: packages/desktop/dist/main.cjs

# macOS configuration
mac:
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  # Use electron-builder's maintained Electron entitlements.
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# Windows configuration
win:
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Cortex

protocols:
  - name: Cortex
    schemes:
      - cortex

# Linux configuration
linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  maintainer: Cortex Foundation / CortexLM
  desktop:
    entry:
      Name: Cortex
      Comment: Cortex
      Terminal: "false"
      Categories: Office;
      MimeType: x-scheme-handler/cortex

appImage:
  license: LICENSE


# Auto-update feed. Packaged apps read this into app-update.yml.
# Production CI copies latest.yml / latest-mac.yml / latest-linux.yml,
# blockmaps, and installers to R2 bucket cortex-releases (objects at the
# bucket root for legacy clients) and cortex-software/latest — see build.yml
# publish-feed. New installers use software.cortex.foundation/latest/.
# Staging dist overrides publish.url to
# https://software.cortex.foundation/staging/. Generic provider only; do not
# add a GitHub channel.
publish:
  provider: generic
  url: https://software.cortex.foundation/latest/
  channel: latest

# build.yml requires signing and notarization credentials before macOS/Windows
# production builds and passes forceCodeSigning=true. Local builds stay usable
# without a signing identity. Notarization uses electron-builder's built-in hook.
