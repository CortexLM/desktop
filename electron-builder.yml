appId: com.cortex.ide
productName: Cortex
copyright: Copyright © 2026 Cortex Foundation / CortexLM
asar: true

directories:
  output: dist
  buildResources: build

files:
  - packages/main/dist/**/*
  - packages/app/dist/**/*
  - packages/preload/dist/**/*
  - node_modules/**/*
  - package.json

# Native addons cannot be loaded from inside an asar: `dlopen` needs a real path on
# disk. Both of these ship a `.node` binary, so they are unpacked beside it.
#
# They are also why `node-pty` and `better-sqlite3` are declared in the ROOT
# package.json rather than only in `packages/main`. electron-builder resolves
# node_modules from the root manifest, not from the `files` globs, so a native addon
# declared only by a workspace package is linked under `packages/main/node_modules/`
# and silently left out — the packaged app then died at import with
# `ERR_MODULE_NOT_FOUND: Cannot find package 'node-pty'`, while the dev build stayed
# fine because it resolves from the workspace instead of the asar.
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*

extraMetadata:
  main: packages/main/dist/index.js

# macOS configuration
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# Windows configuration
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Cortex
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# Linux configuration
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  maintainer: Cortex Foundation / CortexLM
  desktop:
    Name: Cortex
    Comment: Cortex Chat + Code + Bot
    Terminal: false
    Type: Application
    Categories: Development;IDE;

appImage:
  license: LICENSE

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3

# Auto-update feed. Packaged apps read this into app-update.yml.
# CI uploads latest.yml / latest-mac.yml / latest-linux.yml (and
# RELEASES if present) to this origin — see build.yml publish-feed.
# Do not add a second updater channel.
publish:
  provider: generic
  url: https://releases.cortex-ide.com/
  channel: latest

# Code signing (for production, use environment variables)
# afterSign: scripts/notarize.js  # Uncomment for macOS notarization
