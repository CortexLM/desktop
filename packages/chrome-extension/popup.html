<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><strong>Cortex</strong><span id="status" class="badge"></span></header>
<p id="error" role="alert" hidden></p>
<section id="pair" hidden>
  <p>Open Cortex, go to Extensions &gt; Chrome and copy the pairing code.</p>
  <form id="pair-form"><input id="code" autocomplete="off" spellcheck="false" maxlength="9" placeholder="ABCD-2345" aria-label="Pairing code"><button class="primary">Connect</button></form>
</section>
<section id="main" hidden>
  <div class="card"><div class="meta"><span id="title"></span><small id="url"></small></div><button id="share" class="primary">Share this tab</button></div>
  <h2>Shared with Cortex</h2>
  <ul id="list"></ul>
  <p id="empty" class="muted">No tab is shared. Cortex can only read a tab you share here.</p>
  <button id="disconnect" class="link">Disconnect from Cortex</button>
</section>
<script type="module" src="popup.js"></script>
</body>
</html>
